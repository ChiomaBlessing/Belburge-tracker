<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Belburge Tracker — Mobile</title>
<meta name="theme-color" content="#183D2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Belburge">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23183D2C'/%3E%3Ctext x='50' y='64' font-family='monospace' font-size='32' font-weight='700' fill='%23C4841C' text-anchor='middle'%3EBILBT%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23183D2C'/%3E%3Ctext x='50' y='64' font-family='monospace' font-size='26' font-weight='700' fill='%23C4841C' text-anchor='middle'%3EBILBT%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Belburge Tracker","short_name":"Belburge","start_url":".","display":"standalone","background_color":"%23183D2C","theme_color":"%23183D2C"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#183D2C; --forest-2:#1F5038; --forest-3:#3C7A56;
    --slate:#57685C; --paper:#F2F5EC; --panel:#FFFFFF; --ink:#16211A; --ink-soft:#49574C; --line:#D9E1D2;
    --amber:#C4841C; --amber-soft:#F6E7CE; --leaf:#3E7D46; --leaf-soft:#DCEBD8;
    --rust:#A33A2E; --rust-soft:#F5DCD6; --stamp:#8A2E2E;
    --radius:3px; --shadow:0 1px 2px rgba(16,40,26,.08), 0 6px 18px rgba(16,40,26,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans', sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Zilla Slab', serif;font-weight:600;margin:0 0 .3em 0;color:var(--forest);letter-spacing:.2px;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#c7d0bd;border-radius:6px;}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--forest);padding:24px;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px);}
  .auth-shell{width:100%;max-width:440px;}
  .auth-brand{text-align:center;margin-bottom:22px;}
  .auth-brand .stamp-mark{width:44px;height:44px;border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--amber);font-size:13px;margin:0 auto 12px;background:rgba(0,0,0,.15);}
  .auth-brand h1{color:#fff;font-size:20px;margin-bottom:4px;}
  .auth-brand .sub{color:#9FD3AA;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;}
  .auth-card{background:var(--panel);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:32px 30px;max-height:88vh;overflow-y:auto;}
  .auth-card h2{font-size:19px;margin-bottom:6px;}
  .auth-card .lede{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
  .welcome-pitch{color:var(--ink-soft);text-align:center;font-size:13.5px;max-width:34ch;margin:0 auto 26px;}
  .welcome-actions{display:flex;flex-direction:column;gap:10px;}
  select, input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=tel], input[type=file], input[type=color], textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}
  input[type=file]{padding:7px;}
  input[type=color]{padding:3px;height:38px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--forest);background:var(--forest);color:#fff;padding:10px 18px;border-radius:var(--radius);font-weight:600;font-size:13.5px;letter-spacing:.2px;}
  .btn:hover{background:var(--forest-2);}
  .btn.secondary{background:#fff;color:var(--forest);}
  .btn.secondary:hover{background:#F1F4EC;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--slate);padding:8px 10px;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn.full{width:100%;}
  .btn.danger{border-color:var(--rust);background:#fff;color:var(--rust);}
  .btn.danger:hover{background:var(--rust-soft);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .field label{display:block;font-size:11.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field .fhint{font-size:11px;color:var(--slate);margin-top:3px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:600px){ .form-grid,.form-grid3{grid-template-columns:1fr;} }
  .auth-foot{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:16px;}
  .auth-foot button{color:var(--forest-2);font-weight:600;text-decoration:underline;background:none;border:none;padding:0;}
  .demo-box{background:var(--leaf-soft);border:1px solid #BFDCC0;border-radius:var(--radius);padding:10px 12px;font-size:11.5px;color:var(--forest-2);margin-top:16px;}
  .demo-box b{font-family:'IBM Plex Mono',monospace;}
  .err-text{color:var(--rust);font-size:12px;margin:-6px 0 10px;}
  .otp-banner{background:var(--amber-soft); border:1px solid #E4C88E; border-radius:var(--radius); padding:10px 12px; font-size:12px; color:#6E4B0E; margin-bottom:14px;}
  .otp-banner b{font-family:'IBM Plex Mono',monospace; font-size:15px; letter-spacing:3px;}

  #app-shell{display:none; min-height:100vh; grid-template-columns:224px 1fr;}
  @media (min-width:861px){ #app-shell{display:grid;} }
  .sidebar{background:var(--forest);color:#DCE8DD;padding:20px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar .brand{margin-bottom:24px;}
  .sidebar .brand .stamp-mark{width:34px;height:34px;border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--amber);font-size:11px;margin-bottom:10px;}
  .sidebar .brand h2{color:#fff;font-size:16px;margin-bottom:2px;line-height:1.25;}
  .sidebar .brand .sub{font-size:10px;color:#8FB89B;font-family:'IBM Plex Mono',monospace;letter-spacing:.6px;}
  .nav-item{padding:9px 10px;border-radius:var(--radius);font-size:13px;font-weight:500;color:#C6D8C6;margin-bottom:2px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .nav-item.active{background:rgba(255,255,255,.1); color:#fff;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-badge{background:var(--amber);color:#3A2900;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;}
  .sidebar-foot{margin-top:auto; border-top:1px solid rgba(255,255,255,.14); padding-top:14px;}
  .who{font-size:12.5px; color:#fff; font-weight:600; display:flex; align-items:center; gap:8px;}
  .who .role-tag{display:block;font-size:10.5px;color:var(--amber);font-family:'IBM Plex Mono',monospace;margin-top:2px;letter-spacing:.6px;}
  .who .dept-tag{display:block;font-size:10.5px;color:#9BD1A6;margin-top:1px;}

  .main{padding:26px 30px 60px; max-width:1260px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:22px;margin-bottom:4px;}
  .topbar .desc{color:var(--ink-soft);font-size:13px;max-width:64ch;}
  .mobile-topbar{display:none;position:sticky;top:0;z-index:20;background:var(--forest);color:#fff;padding:12px 16px;align-items:center;justify-content:space-between;}
  @media (max-width:860px){
    .mobile-topbar{display:flex;}
    .sidebar{position:fixed;left:0;top:0;z-index:30;width:230px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.35);}
    .sidebar.open{transform:translateX(0);}
    .main{padding:18px 16px 60px;}
  }
  .hold-banner{background:var(--rust);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:12.5px;font-weight:600;margin-bottom:18px;letter-spacing:.3px;}

  .metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  @media (max-width:760px){ .metric-row{grid-template-columns:repeat(2,1fr);} }
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
  .metric .num{font-family:'Zilla Slab',serif;font-size:23px;color:var(--forest);font-weight:600;line-height:1;}
  .metric .lbl{font-size:10.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin-top:6px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .panel-head h3{font-size:15px;margin:0;}
  .panel-body{padding:16px 18px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar input,.toolbar select{width:auto;min-width:130px;}
  .inbox-panel{border:1px solid #E4C88E; background:#FBF4E6;}
  .inbox-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #E4C88E;font-size:12.5px;}
  .inbox-row:last-child{border-bottom:none;}

  .job-row{display:grid;grid-template-columns:120px 1.4fr 1.6fr 90px 100px;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .job-row:last-child{border-bottom:none;}
  .job-row:hover{background:#F7F9F3;}
  .job-row .cnum{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;}
  .job-row .bol{font-size:11px;color:var(--slate);font-family:'IBM Plex Mono',monospace;}
  .job-row .stage-lbl{font-size:12.5px;color:var(--ink-soft);}
  .job-row .owner{font-size:11.5px;color:var(--ink-soft);}
  @media (max-width:700px){ .job-row{grid-template-columns:1fr;gap:4px;} }
  .flag{display:inline-flex;align-items:center;gap:5px;background:var(--rust-soft);color:var(--stamp);border:1px solid #E3B3AC;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
  .flag::before{content:"●";font-size:8px;}
  .pill{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .pill.ok{background:var(--leaf-soft);color:var(--leaf);}
  .pill.wait{background:var(--amber-soft);color:var(--amber);}
  .pill.done{background:#E4E7DE;color:var(--slate);}
  .pill.stepped{background:var(--rust-soft);color:var(--stamp);}

  .rail-wrap{overflow-x:auto;padding-bottom:6px;}
  .rail{display:flex;min-width:900px;position:relative;padding:26px 0 10px;}
  .rail::before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line);}
  .rail-step{flex:1;text-align:center;position:relative;padding:0 3px;}
  .rail-dot{width:15px;height:15px;border-radius:50%;margin:0 auto 8px;position:relative;z-index:2;background:#fff;border:2px solid var(--line);}
  .rail-step.complete .rail-dot{background:var(--leaf);border-color:var(--leaf);}
  .rail-step.current .rail-dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);}
  .rail-step.complete::before,.rail-step.current::before{content:"";position:absolute;left:0;right:50%;top:34px;height:2px;background:var(--leaf);z-index:1;}
  .rail-step:first-child::before{left:50%;}
  .rail-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--slate);letter-spacing:.4px;}
  .rail-step.complete .rail-code,.rail-step.current .rail-code{color:var(--forest);font-weight:600;}
  .rail-name{font-size:10.5px;color:var(--ink-soft);margin-top:2px;max-width:110px;margin-left:auto;margin-right:auto;}
  .stamp-badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--stamp);color:var(--stamp);padding:5px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transform:rotate(-2deg);}

  .detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px;margin-bottom:6px;}
  .kv b{color:var(--slate);font-weight:500;font-size:12px;}
  .history-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .history-row:last-child{border-bottom:none;}
  .history-row .dot{width:7px;height:7px;border-radius:50%;background:var(--forest-3);margin-top:5px;flex-shrink:0;}
  .history-row .t{color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:nowrap;}
  .alert-card{border:1px solid #E3B3AC;background:var(--rust-soft);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .alert-card h4{color:var(--stamp);font-size:13px;margin-bottom:4px;}
  .alert-card p{margin:0 0 8px;font-size:12.5px;color:var(--ink);}
  .bol-card{border:1px solid #E4C88E;background:var(--amber-soft);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .bol-card h4{color:#6E4B0E;font-size:13px;margin-bottom:6px;}
  .stepdown-card{border:1px solid #E3B3AC;background:var(--rust-soft);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .stepdown-card h4{color:var(--stamp);font-size:13px;margin-bottom:6px;}
  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .doc-row:last-child{border-bottom:none;}
  .fin-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .fin-row:last-child{border-bottom:none;font-weight:600;}
  .fin-edit-row{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:6px 0;}
  .fin-edit-row label{font-size:12px;color:var(--ink-soft);}
  .modal-bg{position:fixed;inset:0;background:rgba(16,40,26,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border-radius:var(--radius);max-width:960px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .modal-body{padding:20px 22px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--slate);}
  .empty-state .glyph{font-family:'IBM Plex Mono',monospace;font-size:26px;color:var(--line);margin-bottom:8px;}

  #toast-wrap{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast{background:var(--forest);color:#fff;padding:12px 14px;border-radius:var(--radius);font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:4px solid var(--amber);animation:slidein .2s ease-out;}
  @keyframes slidein{from{transform:translateY(8px);opacity:0;} to{transform:translateY(0);opacity:1;}}
  .action-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .action-item:last-child{border-bottom:none;}
  .action-item .txt{font-size:13px;}
  .action-item .txt .cn{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .tag-line{font-size:11px;color:var(--slate);margin-top:3px;}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--slate);font-family:'IBM Plex Mono',monospace;margin:22px 0 10px;}
  .hint{font-size:12px;color:var(--slate);margin-top:4px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .bar-track{background:#E7EBE1;border-radius:20px;height:9px;overflow:hidden;}
  .bar-fill{background:var(--forest-3);height:100%;border-radius:20px;}
  .bar-fill.amber{background:var(--amber);}
  .bar-fill.rust{background:var(--rust);}
  .dept-chip{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--forest-2);background:var(--leaf-soft);padding:2px 7px;border-radius:10px;margin-right:6px;}
  .staff-row{display:grid;grid-template-columns:1fr 1.2fr .9fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .staff-row:last-child{border-bottom:none;}
  @media (max-width:800px){ .staff-row{grid-template-columns:1fr 1fr; row-gap:4px;} }
  .charge-edit{display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-top:8px;}
  .charge-edit .field{margin-bottom:0; flex:1; min-width:130px;}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--leaf-soft);color:var(--forest);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Zilla Slab',serif;font-size:18px;object-fit:cover;flex-shrink:0;}
  .avatar-sm{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--leaf-soft);}
  .perm-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .perm-row:last-child{border-bottom:none;}
  .perm-yes{color:var(--leaf);font-weight:700;}
  .perm-no{color:var(--rust);font-weight:700;}
  .thread-item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .thread-item:hover{background:#F7F9F3;}
  .msg-bubble{background:#F1F4EC;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;max-width:80%;}
  .msg-bubble.mine{background:var(--leaf-soft);margin-left:auto;}
  .msg-meta{font-size:10.5px;color:var(--slate);margin-bottom:3px;}
  .settings-section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px;}
  .settings-section:first-child{border-top:none;margin-top:0;padding-top:0;}
  .toggle-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
  .disabled-note{font-size:11px;color:var(--slate);font-style:italic;}
  .idcard-preview{max-width:260px;border-radius:var(--radius);border:1px solid var(--line);margin-top:8px;}
  .verify-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;}

  /* ========================= MOBILE APP SHELL (overrides everything above) ========================= */
  html,body{height:100%;}
  body{overscroll-behavior-y:none;}
  #login-screen{min-height:100vh;padding:20px 18px;padding-top:max(20px, env(safe-area-inset-top));}
  .auth-card{padding:26px 20px;}

  #app-shell{display:none; grid-template-columns:none; min-height:100vh; min-height:100dvh; flex-direction:column; position:relative;}
  .sidebar, .mobile-topbar{display:none !important;}

  .app-bar{display:flex; align-items:center; gap:10px; padding:10px 14px; padding-top:max(10px, env(safe-area-inset-top));
    background:var(--forest); color:#fff; position:sticky; top:0; z-index:25; box-shadow:0 2px 10px rgba(0,0,0,.2);}
  .app-bar .ab-btn{background:transparent;border:none;color:var(--amber);font-size:20px;line-height:1;padding:6px;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .app-bar .ab-btn:active{background:rgba(255,255,255,.12);}
  .app-bar .ab-title{flex:1; min-width:0;}
  .app-bar .ab-title .t1{font-family:'Zilla Slab',serif; font-size:16px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ========================= API CLIENT =========================
   This file is a static page with no backend of its own, so it talks to a
   small real server (Node + PostgreSQL) over HTTPS for every read and write.
   That server is what makes data shared across every device/browser — not
   just across tabs on one device like the old localStorage version. Each
   browser is told the server's URL once (saved locally) and from then on
   every window.storage.get/set call is a real network request. */
const API_BASE_KEY = 'belburge_api_base';
function getApiBase(){ try{ const v=localStorage.getItem(API_BASE_KEY); if(v) return v; // auto-detect: backend is served on same origin as frontend (for prod & capacitor live)
    if(typeof window!=='undefined' && window.location && window.location.origin && window.location.origin.startsWith('http')) return window.location.origin;
    return ''; }catch(e){ return ''; } }
function setApiBase(url){ try{ localStorage.setItem(API_BASE_KEY, String(url||'').trim().replace(/\/+$/,'')); }catch(e){} }
function getAuthToken(){ try{ return localStorage.getItem('belburge_token') || ''; }catch(e){ return ''; } }
function setAuthToken(t){ try{ if(t) localStorage.setItem('belburge_token', t); else localStorage.removeItem('belburge_token'); }catch(e){} }

async function apiFetch(path, opts){
  const base = getApiBase();
  if(!base) { const e = new Error('No server configured yet.'); e.code='NO_API_BASE'; throw e; }
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getAuthToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  let res;
  try{
    res = await fetch(base + path, Object.assign({}, opts, {headers}));
  }catch(netErr){
    const e = new Error('Could not reach the server. Check the server URL and your connection.');
    e.code='NETWORK'; throw e;
  }
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(res.status===401){ setAuthToken(''); }
  if(!res.ok){
    const err = new Error((body && body.error) || ('Request failed (HTTP '+res.status+').'));
    err.status = res.status; err.body = body;
    throw err;
  }
  return body;
}

window.storage = {
  get: async function(key){
    const body = await apiFetch('/api/storage/'+encodeURIComponent(key), {method:'GET'});
    return (body && body.value!=null) ? { value: body.value } : null;
  },
  set: async function(key, value){
    await apiFetch('/api/storage/'+encodeURIComponent(key), {method:'PUT', body: JSON.stringify({value: value})});
    try{ window.dispatchEvent(new CustomEvent('belburge:local-change', {detail:{key}})); }catch(e){}
  }
};

/* One-time seed: on a brand-new, empty database there is no admin yet to
   approve anyone, so the first device to talk to a fresh server automatically
   hands it the familiar demo dataset. The server refuses (409) once it
   already has real data, so this is a harmless no-op on every later load. */
async function tryBootstrapServer(){
  try{
    const accounts = seedUsers().map(u=>({id:u.id, email:u.login, password:u.password||'demo123'}));
    const users = seedUsers().map(u=>{ const c=Object.assign({},u); delete c.password; return c; });
    await apiFetch('/api/bootstrap-demo-data', {method:'POST', body: JSON.stringify({
      collections: {
        containers: seedContainers(), users: users, 'activity-log': [],
        referrals: [], messages: [], 'org-settings': DEFAULT_SETTINGS
      },
      accounts: accounts
    })});
  }catch(e){ /* already seeded, or server not reachable yet — either way, non-fatal */ }
}

/* ========================= LIVE SYNC =========================
   Keeps every signed-in screen up to date automatically across every device:
   a WebSocket push gives near-instant updates, and a background poll is kept
   as a fallback in case the socket drops. */
let liveSyncTimer = null;
let liveSocket = null;
async function refreshFromStorage(){
  if(!state.role) return; // nothing to keep in sync before sign-in
  try{
    const [containers, users, log, settings, referrals, messages] = await Promise.all([
      loadContainers(), loadUsers(), loadLog(), loadSettings(), loadReferrals(), loadMessages()
    ]);
    const containersStr = JSON.stringify(containers), usersStr = JSON.stringify(users), logStr = JSON.stringify(log),
      referralsStr = JSON.stringify(referrals), messagesStr = JSON.stringify(messages), settingsStr = JSON.stringify(settings);
    const changed = containersStr!==JSON.stringify(state.containers) || usersStr!==JSON.stringify(state.users) ||
      logStr!==JSON.stringify(state.log) || referralsStr!==JSON.stringify(state.referrals) ||
      messagesStr!==JSON.stringify(state.messages) || settingsStr!==JSON.stringify(state.settings);
    if(!changed) return;
    state.containers = containers; state.users = users; state.log = log;
    state.settings = settings; state.referrals = referrals; state.messages = messages;
    const modalOpen = document.getElementById('modal-bg') && document.getElementById('modal-bg').classList.contains('open');
    if(modalOpen && state.openContainerId && byId(state.openContainerId)){
      openContainer(state.openContainerId);
    } else if(!modalOpen){
      renderApp();
    }
  }catch(e){ /* non-fatal — next tick will retry */ }
}
function connectLiveSocket(){
  try{
    if(liveSocket){ try{ liveSocket.close(); }catch(e){} liveSocket=null; }
    const base = getApiBase(); const token = getAuthToken();
    if(!base || !token) return;
    const wsUrl = base.replace(/^http/,'ws') + '/ws?token=' + encodeURIComponent(token);
    const sock = new WebSocket(wsUrl);
    sock.onmessage = function(ev){
      try{ const msg = JSON.parse(ev.data); if(msg && msg.type==='changed') refreshFromStorage(); }catch(e){}
    };
    sock.onclose = function(){ if(liveSocket===sock) liveSocket=null; };
    sock.onerror = function(){ try{ sock.close(); }catch(e){} };
    liveSocket = sock;
  }catch(e){ /* WebSocket not available — the poll below still covers it */ }
}
function startLiveSync(){
  if(liveSyncTimer) return;
  connectLiveSocket();
  liveSyncTimer = setInterval(function(){
    if(!liveSocket || liveSocket.readyState!==1) connectLiveSocket(); // reconnect if the socket dropped
    refreshFromStorage();
  }, 4000);
}
function stopLiveSync(){
  if(liveSyncTimer){ clearInterval(liveSyncTimer); liveSyncTimer=null; }
  if(liveSocket){ try{ liveSocket.close(); }catch(e){} liveSocket=null; }
}

  if(!confirm('Erase all shared demo data (jobs, accounts, activity, settings) and reseed? This affects everyone using this server.')) return;
  const seedAccounts = seedUsers().map(u=>({id:u.id, email:u.login, password:u.password||'demo123'}));

}

/* ========================= HELPERS ========================= */
function fmtNaira(n){ return '₦' + Number(n||0).toLocaleString('en-NG'); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function byId(id){ return state.containers.find(c=>c.id===id); }
function userById(id){ return state.users.find(u=>u.id===id); }
function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3800);
}
function visibleContainers(){
  if(state.role==='admin') return state.containers;
  if(state.role==='importer') return state.containers.filter(c=>c.owner===state.person);
  if(state.role==='agent') return state.containers.filter(c=>c.agent===state.person);
  return [];
}
function activeAlertCount(list){ return list.reduce((n,c)=>n+c.alerts.filter(a=>a.status==='active').length,0); }
function daysBetween(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function uniqueNames(list, key){ return [...new Set(list.map(c=>c[key]))].filter(Boolean); }
function canSeeFenBol(){ return state.role==='admin' && FEN_BOL_DEPTS.includes(state.department); }
function canSeeFinance(){ return state.role==='admin' && FINANCE_DEPTS.includes(state.department); }
function isSuperAdmin(){ return state.role==='admin' && state.department==='Admin'; }
function ownerAgentLabel(c){
  const parts = [];
  if(c.owner) parts.push('Importer: '+c.owner);
  if(c.agent) parts.push('Agent: '+c.agent);
  return parts.join(' · ') || 'Unlinked job';
}
function allowedStagesFor(dept){
  if(dept==='Admin') return STAGES.map((s,i)=>i);
  return (state.settings.deptStageAccess && state.settings.deptStageAccess[dept]) || [];
}
function canAdvanceAnyStage(){ return isSuperAdmin() || allowedStagesFor(state.department).length>0; }
function masterHoldActive(){ return !!(state.settings && state.settings.masterHold); }
function checkMasterHold(){
  if(masterHoldActive() && !isSuperAdmin()){ toast('Master Hold is active — Admin has frozen this action across the terminal.'); return true; }
  return false;
}
function getPermissions(dept){
  if(dept==='Admin') return {
    'Create First Entry Note':true,'Complete Book of Life':true,'Advance any container stage':true,
    'Force-advance / override sequence':true,'Approve or reject invoices':true,'Record duty payments':true,
    'Step a container down':true,'Manage staff accounts':true,'Approve new user verification':true,
    'Edit system settings & Master Hold':true,'Waive demurrage fees':true
  };
  const stages = allowedStagesFor(dept);
  return {
    'Create First Entry Note': FEN_BOL_DEPTS.includes(dept),
    'Complete Book of Life': FEN_BOL_DEPTS.includes(dept),
    'Advance container stage': stages.length>0,
    'Force-advance / override sequence': false,
    'Upload / edit invoices': FINANCE_DEPTS.includes(dept),
    'Approve or reject invoices': false,
    'Record duty payments': FINANCE_DEPTS.includes(dept),
    'Step a container down': true,
    'Manage staff accounts': false,
    'Approve new user verification': false,
    'Edit system settings & Master Hold': false,
    'Waive demurrage fees': false
  };
}

async function submitIdVerification(){
  const idType = document.getElementById('id-type').value;
  const fileInput = document.getElementById('id-file');
  const file = fileInput.files && fileInput.files[0];
  let idImage = null, idFileName = null;
  if(file){
    idFileName = file.name;
    if(file.size < 350000){
      try{ idImage = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
      catch(e){ idImage = null; }
    }
  } else {
    state.authError = 'Please choose an ID photo to upload.'; renderAuthCard(); return;
  }
  const d = state.regDraft;
  const newId = 'u'+Date.now();
  try{
    await apiFetch('/api/auth/register', {method:'POST', body: JSON.stringify({id:newId, email:d.email, password:d.password})});
  }catch(err){
    state.authError = (err && err.status===409) ? 'That email is already registered. Try signing in.' : (err.message||'Could not reach the server.');
    renderAuthCard(); return;
  }
  const user = normalizeUser({
    id:newId, name:d.name, login:d.email, phone:d.phone, org:d.org,
    role:d.role, department:d.department, corporateRegNumber:d.corporateRegNumber||null,
    idType, idFileName, idImage, status:'pending_verification'
  });
  state.users.push(user);
  await saveUsers(state.users);
  await pushSecurityLog(`New self-registration awaiting verification: ${user.name} (${ROLE_META[user.role].name}${user.department?', '+user.department:''})`);
  setAuthView('pending');
}

      resp = await apiFetch('/api/auth/login', {method:'POST', body: JSON.stringify({email: login, password: password})});
    }catch(err){
      state.authError = (err.status===401) ? 'No matching account. Check the role, email or username, and password.' : (err.message||'Could not reach the server.');
      renderAuthCard(); return;
    }
    setAuthToken(resp.token);
    let users;
    try{ users = await loadUsers(); }catch(e){ state.authError='Signed in, but could not load account details. Try again.'; setAuthToken(''); renderAuthCard(); return; }
    const u = users.find(x=>x.id===resp.userId);
    if(!u || u.role!==role){ state.authError='No matching account. Check the role, email or username, and password.'; setAuthToken(''); renderAuthCard(); return; }
    if(u.status==='pending_verification'){ state.authError='This account is awaiting BILBT Admin verification.'; setAuthToken(''); renderAuthCard(); return; }
    if(u.status==='suspended'){ state.authError='This account has been suspended. Contact BILBT Admin.'; setAuthToken(''); renderAuthCard(); return; }
    if(u.status==='deactivated'){ state.authError='This account has been deactivated.'; setAuthToken(''); renderAuthCard(); return; }
    state.users = users;
    await finishLogin(u.id);
  }
  if(e.target && e.target.id==='server-setup-form'){
    e.preventDefault();
    const url = document.getElementById('setup-url').value.trim();
    if(!url){ return; }
    setApiBase(url);
    state.authError='';
    await tryBootstrapServer();
    setAuthView('welcome');
  }
  if(e.target && e.target.id==='register-form'){
    e.preventDefault();
    const name = document.getElementById('r-name').value.trim();
    const email = document.getElementById('r-email').value.trim();
    const phone = document.getElementById('r-phone').value.trim();
    const password = document.getElementById('r-password').value;
    const password2 = document.getElementById('r-password2').value;
    const role = document.getElementById('r-role').value;
    const org = document.getElementById('r-org').value.trim() || (role==='admin' ? 'Belburge International Limited' : 'Independent');
    const corporateRegNumber = role!=='admin' ? document.getElementById('r-cac').value.trim() : null;
    const department = role==='admin' ? document.getElementById('r-dept').value : null;
    if(!name || !email){ state.authError='Full name and email are required.'; renderAuthCard(); return; }
    if(!/^0\d{10}$/.test(phone)){ state.authError='Enter a valid 11-digit phone number starting with 0.'; renderAuthCard(); return; }
    const minLen = (state.settings && state.settings.minPasswordLength) || 6;
    if(password.length<minLen){ state.authError=`Password must be at least ${minLen} characters.`; renderAuthCard(); return; }
    if(password!==password2){ state.authError='Passwords do not match.'; renderAuthCard(); return; }
    state.regDraft = {name, email, phone, password, org, role, department, corporateRegNumber};
    state.otp = null; state.otpChannel = null;
    setAuthView('otp');
  }
});
async function verifyOtp(){
  const code = document.getElementById('r-otp').value.trim();
  if(code !== state.otp){ state.authError='Incorrect code. Please try again.'; renderAuthCard(); return; }
  setAuthView('idupload');
}
async function finishLogin(userId){
  const u = state.users.find(x=>x.id===userId);
  if(!u) return;
  u.lastLoginDevice = navigator.userAgent;
  u.lastLoginDate = new Date().toISOString();
  await saveUsers(state.users);
  state.role = u.role; state.person = u.name; state.userId = u.id; state.department = u.department;
  state.activeTab='dashboard';
  state.containers = await loadContainers();
  state.log = await loadLog();
  state.referrals = await loadReferrals();
  state.messages = await loadMessages();
  renderApp();
  startIdleTimer();
  startLiveSync();
}
function logout(){
  stopIdleTimer();
  stopLiveSync();
  setAuthToken('');
  state.role=null; state.person=null; state.department=null; state.openContainerId=null;
  document.getElementById('modal-bg').classList.remove('open');
  closeMoreSheet();
  renderLogin();
}
function startIdleTimer(){
  stopIdleTimer();
  const mins = (state.settings && state.settings.idleTimeoutMinutes) || 15;
  const reset = ()=>{
    clearTimeout(state.idleTimer);
    state.idleTimer = setTimeout(()=>{ toast('Logged out due to inactivity.'); logout(); }, mins*60000);
  };
  ['mousemove','keydown','click','scroll'].forEach(evt=>document.addEventListener(evt, reset));
  reset();
}
function stopIdleTimer(){ if(state.idleTimer) clearTimeout(state.idleTimer); }

async function saveProfile(){
  const u = userById(state.profileTargetId);
  const isSelf = state.profileTargetId===state.userId;
  const editingAsAdmin = !isSelf && isSuperAdmin();
  const picInput = document.getElementById('p-pic');
  if(picInput && picInput.files && picInput.files[0] && picInput.files[0].size < 300000){
    u.profilePic = await new Promise((res)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(picInput.files[0]); });
  }
  if(document.getElementById('p-name') && !document.getElementById('p-name').disabled) u.name = document.getElementById('p-name').value.trim() || u.name;
  if(document.getElementById('p-login') && !document.getElementById('p-login').disabled) u.login = document.getElementById('p-login').value.trim() || u.login;
  if(document.getElementById('p-phone') && !document.getElementById('p-phone').disabled) u.phone = document.getElementById('p-phone').value.trim() || u.phone;
  if(document.getElementById('p-org') && !document.getElementById('p-org').disabled) u.org = document.getElementById('p-org').value.trim() || u.org;
  if(document.getElementById('p-cac') && !document.getElementById('p-cac').disabled) u.corporateRegNumber = document.getElementById('p-cac').value.trim();
  if(document.getElementById('p-station') && !document.getElementById('p-station').disabled) u.stationedAt = document.getElementById('p-station').value;
  if(document.getElementById('p-dept')) u.department = document.getElementById('p-dept').value;
  await saveUsers(state.users);
  if(editingAsAdmin) await pushSecurityLog(`${state.person} updated profile details for ${u.name}`);
  toast('Profile updated.');
  closeModal();
  if(isSelf) renderApp();
}
async function adminResetPassword(uid){
  const u = userById(uid);
  const temp = Math.random().toString(36).slice(-8);
  try{
    await apiFetch('/api/auth/set-password', {method:'POST', body: JSON.stringify({email: u.login, newPassword: temp})});
  }catch(err){ toast('Could not reset password: ' + (err.message||'server error')); return; }
  await pushSecurityLog(`${state.person} reset the password for ${u.name}`);
  toast(`New temporary password for ${u.name}: ${temp} (share this with them securely — demo only, no real email/SMS is sent).`);
}
async function adminResetDevice(uid){
  const u = userById(uid);
  u.forceReauth = true;
  await saveUsers(state.users);
  await pushSecurityLog(`${state.person} cleared sessions and reset device/MFA lock for ${u.name}`);
  toast(`${u.name} can now sign in on a new device. (Demo note: this app has no real device binding or MFA to clear — this records the action for audit purposes.)`);
}
async function toggleSuspend(uid){
  const u = userById(uid);
  u.status = u.status==='suspended' ? 'active' : 'suspended';
  await saveUsers(state.users);
  await pushSecurityLog(`${state.person} ${u.status==='suspended'?'suspended':'reactivated'} ${u.name}'s account`);

  openProfile(uid);
}

function idTagsLine(c){
  const tags = [];
  if(c.transferLetterNumber) tags.push(`TL: ${c.transferLetterNumber}`);
  if(c.invoiceNumber) tags.push(`Inv: ${c.invoiceNumber}`);
  if(c.exitNumber) tags.push(`Exit: ${c.exitNumber}`);
  if(c.transporter && c.transporter.name) tags.push(`Transporter: ${c.transporter.name}`);
  return tags.length ? ` · <span class="mono" style="font-size:10px;">${tags.join(' · ')}</span>` : '';
}
function jobListHTML(list){
  if(list.length===0) return `<div class="empty-state"><div class="glyph">// //</div>No containers to show.</div>`;
  const sorted = [...list].sort((a,b)=> activeAlertCount([b]) - activeAlertCount([a]) || a.stageIdx-b.stageIdx);
  return sorted.map(c=>{
    const alerts = c.alerts.filter(a=>a.status==='active');
    const stage = STAGES[c.stageIdx];
    const pillClass = c.stageIdx>=13 ? 'done' : (alerts.length? 'wait':'ok');
    let colText;
    if(state.role==='importer') colText = c.agent ? c.agent : 'Direct import — no agent';
    else if(state.role==='agent') colText = c.owner ? c.owner : 'Agent-sourced — no importer';
    else colText = ownerAgentLabel(c);
    let statusHtml = alerts.length? `<span class="flag">${alerts[0].type}</span>` : `<span class="pill ${pillClass}">${c.stageIdx>=13?'Delivered':(c.stageIdx>=9?'At terminal':'In CPC')}</span>`;
    if(c.sealMismatch) statusHtml = `<span class="flag">Seal mismatch</span>`;
    if(c.steppedDown.status) statusHtml = `<span class="pill stepped">Stepped down</span>`;
    return `<div class="job-row" data-cnum="${c.containerNumber.toLowerCase()}" data-bol="${c.billOfLading.toLowerCase()}" data-owner="${c.owner||''}" data-agent="${c.agent||''}" data-stagegroup="${stageGroup(c)}" onclick="openContainer('${c.id}')">
      <div class="cnum">${c.containerNumber}</div>
      <div><div>${c.item}</div><div class="bol">${c.billOfLading} · ${c.size}${!c.bolComplete?' · <span style=\'color:#6E4B0E\'>DTI assessment pending</span>':''}${idTagsLine(c)}</div></div>
      <div class="stage-lbl">${stage.label}</div>
      <div class="owner">${colText}</div>
      <div>${statusHtml}</div>
    </div>`;
  }).join('');
}
function stageGroup(c){ return c.stageIdx>=13 ? 'delivered' : (c.stageIdx>=9 ? 'bilbt' : 'cpc'); }
function filterJobRows(q){
  q = (q||'').toLowerCase();
  document.querySelectorAll('#job-list .job-row').forEach(r=>{
    const match = r.dataset.cnum.includes(q) || r.dataset.bol.includes(q);
    r.style.display = match ? 'grid' : 'none';
  });
}
function applyAdminFilters(){
  const status = document.getElementById('f-status') ? document.getElementById('f-status').value : 'all';
  const owner = document.getElementById('f-owner-filter') ? document.getElementById('f-owner-filter').value : 'all';
  const agent = document.getElementById('f-agent-filter') ? document.getElementById('f-agent-filter').value : 'all';
  const q = document.getElementById('job-search') ? document.getElementById('job-search').value.toLowerCase() : '';
  document.querySelectorAll('#job-list .job-row').forEach(r=>{
    let show = true;
    if(status!=='all' && r.dataset.stagegroup!==status) show=false;
    if(owner!=='all' && r.dataset.owner!==owner) show=false;
    if(agent!=='all' && r.dataset.agent!==agent) show=false;
    if(q && !(r.dataset.cnum.includes(q) || r.dataset.bol.includes(q))) show=false;
    r.style.display = show ? 'grid' : 'none';
  });
}

function onFenTypeChange(){
  const type = document.getElementById('f-jobtype').value;
  document.getElementById('f-owner-field').style.display = type==='importer' ? 'block' : 'none';
  document.getElementById('f-agent-field').style.display = type==='agent' ? 'block' : 'none';
}
async function submitFEN(e){
  e.preventDefault();
  const cnum = document.getElementById('f-cnum').value.trim().toUpperCase();
  const bol = document.getElementById('f-bol').value.trim();
  const jobtype = document.getElementById('f-jobtype').value;
  const owner = jobtype==='importer' ? document.getElementById('f-owner').value : null;
  const agent = jobtype==='agent' ? document.getElementById('f-agent').value : null;
  if(!cnum || !bol){ toast('Container number and Bill of Lading are required.'); return; }
  if(jobtype==='importer' && !owner){ toast('Select an importer, or register one first.'); return; }
  if(jobtype==='agent' && !agent){ toast('Select a clearing agent, or register one first.'); return; }
  if(state.containers.some(c=>c.containerNumber===cnum)){ toast('That container number is already registered.'); return; }
  const c = normalizeContainer({
    id:'c'+Date.now(), containerNumber:cnum, billOfLading:bol,
    size:document.getElementById('f-size').value,
    item:document.getElementById('f-item').value.trim() || 'Unspecified cargo',
    destination:document.getElementById('f-dest').value.trim() || 'Not specified',
    owner, agent, bolComplete:false, aNumber:null, cNumber:null, stageIdx:0,
    history:[{stage:0, t:new Date().toISOString(), user:state.person}],
    alerts:[], documents:[],
    financial:{processingCharge:Number(document.getElementById('f-processing').value)||0},
    detentionStart:null, steppedDown:{status:false,comment:'',by:null,date:null}, createdAt:new Date().toISOString()
  });
  state.containers.push(c);
  await saveContainers(state.containers);
  await pushLog(`New job registered: ${cnum} (FEN) by ${state.person}. DTI draft assessment required.`, 'DTI');
  toast(`${cnum} registered in First Entry Note.`);
  renderTab();
}

function financialTotalOf(c, extra){
  extra = extra||0;
  const other = (c.financial.otherExpenses||[]).reduce((s,o)=>s+(Number(o.amount)||0),0);
  return c.financial.processingCharge + c.financial.mptRating + c.financial.shippingRating + c.financial.bilbtCharges + c.financial.clearingExpenses +
    c.financial.transportation + c.financial.manifestExpenses + c.financial.paarExpenses + c.financial.customsDuties + c.financial.sonRemitaAmount + other + extra;
}

function financeReadRowsHTML(c){
  const rows = [['Processing charge',c.financial.processingCharge],['MPT RATING',c.financial.mptRating],['Shipping line RATING',c.financial.shippingRating],['BILBT terminal charges',c.financial.bilbtCharges],

    ['PAAR expenses',c.financial.paarExpenses],['SON Remita amount',c.financial.sonRemitaAmount],[`Customs duties (${c.financial.dutyStatus})`,c.financial.customsDuties]];
  (c.financial.otherExpenses||[]).forEach(o=>rows.push([o.label, o.amount]));
  return (c.financial.sonRemitaRef?`<div class="kv"><b>SON Remita ref</b><span class="mono">${c.financial.sonRemitaRef}</span></div>`:'') +
    rows.map(([l,v])=>`<div class="fin-row"><span>${l}</span><span>${fmtNaira(v)}</span></div>`).join('');

function addOtherExpenseRow(id){

async function saveFinancials(id){
  const c = byId(id);
  ['processingCharge','mptRating','shippingRating','bilbtCharges','clearingExpenses','transportation','manifestExpenses','paarExpenses','sonRemitaAmount'].forEach(k=>{
    const el = document.getElementById('fin-'+k);
    if(el) c.financial[k] = Number(el.value)||0;
  });
  const sonRefEl = document.getElementById('fin-sonRemitaRef');
  if(sonRefEl) c.financial.sonRemitaRef = sonRefEl.value.trim() || null;
  const others = [];
  (c.financial.otherExpenses||[]).forEach((o,i)=>{
    const lbl = document.getElementById('other-label-'+i), amt = document.getElementById('other-amt-'+i);
    if(lbl) others.push({label: lbl.value.trim()||'Other', amount: Number(amt.value)||0});
  });
  c.financial.otherExpenses = others;
  await saveContainers(state.containers);
  await pushLog(`Financial breakdown updated for ${c.containerNumber} by ${state.person}`);
  toast('Financial breakdown saved.');
  openContainer(id);
}

async function updateStage(id){
  if(checkMasterHold()) return;
  const c = byId(id);
  const idx = parseInt(document.getElementById('stage-select').value,10);
  const forceCb = document.getElementById('force-advance');
  const force = forceCb && forceCb.checked;
  if(idx === c.stageIdx){ toast('Already at that stage.'); return; }
  if(!force && !isSuperAdmin()){
    const allowed = allowedStagesFor(state.department);
    if(!allowed.includes(idx)){ toast(`Your department (${state.department}) is not authorized to set this stage.`); return; }
  }
  if(idx>=10 && !c.bolComplete && !force){ toast('Assessment (Book of Life) must be completed before examination can begin.'); return; }
  if(Math.abs(idx - c.stageIdx) > 1 && !force){
    if(!confirm('Stage progression looks out of sequence. Continue anyway?')) return;
  }
  let reasonNote = '';
  if(force){
    const reasonEl = document.getElementById('force-reason');
    const reason = reasonEl ? reasonEl.value.trim() : '';
    if(!reason){ toast('Enter a justification to force-advance.'); return; }
    reasonNote = ` [FORCED by Admin: ${reason}]`;
    await pushSecurityLog(`${state.person} force-advanced ${c.containerNumber} from ${STAGES[c.stageIdx].code} to ${STAGES[idx].code}: ${reason}`);
  }
  c.stageIdx = idx;
  c.history.push({stage:idx, t:new Date().toISOString(), user: state.person});
  if(idx===6 && !c.transireSubmittedDate) c.transireSubmittedDate = new Date().toISOString();
  if(idx===12 && !c.detentionStart) c.detentionStart = new Date().toISOString();
  if(idx===13 && !c.deliveredDate) c.deliveredDate = new Date().toISOString();
  await saveContainers(state.containers);
  const dept = STAGE_DEPT[idx];
  await pushLog(`${c.containerNumber} moved to ${STAGES[idx].code} — ${STAGES[idx].label}. Action now with ${dept}. (by ${state.person})${reasonNote}`, dept);
  if(idx===9) await pushLog(`${c.containerNumber} arrived at BILBT — schedule examination.`, 'Operations');
  if(idx===11) await pushLog(`${c.containerNumber} released by customs — ready for delivery.`, 'Transport');
  toast(`${c.containerNumber} updated to ${STAGES[idx].code}.`);
  openContainer(id); renderApp();
}

function computePendingTasks(){
  const all = state.containers;
  const active = all.filter(c=>!c.steppedDown.status);
  const tasks = [];
  const dept = state.department;
  if(isSuperAdmin() || dept==='Documentation'){
    const n = all.filter(c=>!c.transferLetterNumber).length;
    if(n) tasks.push({text:`${n} job(s) still need a BILBT transfer letter number.`, tab:'bol'});
  }
  if(isSuperAdmin() || dept==='DTI'){
    const n = all.filter(c=>!c.bolComplete).length;
    if(n) tasks.push({text:`${n} job(s) awaiting DTI assessment (A-Number / C-Number).`, tab:'bol'});
  }
  if(isSuperAdmin() || dept==='Field Staff'){
    const n = active.filter(c=>c.stageIdx<=8 && daysBetween(c.createdAt)>3).length;
    if(n) tasks.push({text:`${n} job(s) have been in CPC processing for more than 3 days.`, tab:'endtoend'});
  }
  if(isSuperAdmin() || dept==='Operations'){
    const arrived = active.filter(c=>c.stageIdx===9).length;
    const noPlacement = active.filter(c=>c.stageIdx>=9 && !c.placementActual).length;
    const noExit = active.filter(c=>c.stageIdx>=11 && !c.exitNumber).length;
    if(arrived) tasks.push({text:`${arrived} job(s) arrived at BILBT and need examination scheduled.`, tab:'endtoend'});
    if(noPlacement) tasks.push({text:`${noPlacement} job(s) at the terminal have no recorded placement (ground / stacked).`, tab:'endtoend'});
    if(noExit) tasks.push({text:`${noExit} job(s) cleared release but have no exit number recorded.`, tab:'bol'});
  }
  if(isSuperAdmin() || dept==='Transport'){
    const n = active.filter(c=>c.stageIdx===11 && !c.deliveryLocation).length;
    if(n) tasks.push({text:`${n} released job(s) have no delivery location on file yet.`, tab:'endtoend'});
  }
  if(isSuperAdmin() || dept==='Accountant'){
    const noInv = all.filter(c=>!c.invoiceNumber).length;
    const pendingDuty = active.filter(c=>c.financial.dutyStatus==='pending').length;
    const pendingInvoices = all.reduce((s,c)=>s+c.invoices.filter(i=>i.status==='pending').length,0);
    if(noInv) tasks.push({text:`${noInv} job(s) have no invoice / charge number issued yet.`, tab:'finance'});
    if(pendingDuty) tasks.push({text:`${pendingDuty} job(s) have duties still pending payment.`, tab:'finance'});
    if(pendingInvoices) tasks.push({text:`${pendingInvoices} uploaded invoice(s) awaiting Admin approval.`, tab:'finance'});
  }
  if(isSuperAdmin()){
    const pu = state.users.filter(u=>u.status==='pending_verification').length;
    if(pu) tasks.push({text:`${pu} account(s) awaiting identity verification.`, tab:'verification'});
    const pendingInvoicesAll = all.reduce((s,c)=>s+c.invoices.filter(i=>i.status==='pending').length,0);
    if(pendingInvoicesAll) tasks.push({text:`${pendingInvoicesAll} invoice(s) awaiting your approval.`, tab:'finance'});
  }
  return tasks;
}

async function bulkImportCsv(){
  const raw = document.getElementById('csv-input').value.trim();
  if(!raw){ toast('Paste CSV rows first.'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let created = 0, skipped = 0;
  for(const line of lines){
    const [name,email,phone,department] = line.split(',').map(s=>(s||'').trim());
    if(!name || !email){ skipped++; continue; }
    const temp = Math.random().toString(36).slice(-8);
    const newId = 'u'+Date.now()+created;
    try{
      await apiFetch('/api/auth/register', {method:'POST', body: JSON.stringify({id:newId, email, password:temp})});
    }catch(err){ skipped++; continue; }
    state.users.push(normalizeUser({id:newId, name, login:email, phone, org:'Belburge International Limited', role:'admin', department: DEPARTMENTS.includes(department)?department:'Documentation', status:'active'}));
    created++;
  }
  await saveUsers(state.users);

function exportUsersCsv(){

  const csv = rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(csv, 'belburge-users.csv', 'text/csv');

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

        <h3 style="font-size:14px;">Terminal storage rates</h3>
        <div class="form-grid">
          <div class="field"><label>Free days</label><input type="number" id="s-freedays" value="${s.freeDays}"></div>
          <div class="field"><label>Daily penalty rate (₦)</label><input type="number" id="s-rate" value="${s.dailyPenaltyRate}"></div>
        </div>
      </div>
      <div class="settings-section">
        <h3 style="font-size:14px;">Password & session policy</h3>
        <div class="form-grid">
          <div class="field"><label>Minimum password length</label><input type="number" id="s-minpass" value="${s.minPasswordLength}"></div>
          <div class="field"><label>Password expiry (days)</label><input type="number" id="s-passexp" value="${s.passwordExpiryDays}"></div>
          <div class="field"><label>Idle timeout (minutes)</label><input type="number" id="s-idle" value="${s.idleTimeoutMinutes}"></div>
        </div>
        <div class="toggle-row"><input type="checkbox" id="s-complexity" ${s.passwordComplexity?'checked':''}> <label for="s-complexity">Require upper/lower-case + number in passwords</label></div>
        <div class="toggle-row"><input type="checkbox" id="s-mfa" ${s.mfaRequired?'checked':''}> <label for="s-mfa">Require Multi-Factor Authentication</label></div>
        <div class="toggle-row"><input type="checkbox" id="s-sso" ${s.ssoRequired?'checked':''}> <label for="s-sso">Enforce company-wide Single Sign-On</label></div>
        <div class="disabled-note">Idle timeout, minimum length, and expiry are enforced by this app. MFA/SSO enforcement needs a real identity provider — this toggle only records the policy.</div>
        <div class="field" style="margin-top:10px;"><label>Corporate IP / VPN allow-list</label><textarea id="s-ip" rows="2">${s.ipAllowList}</textarea>
          <div class="disabled-note">Recorded only — a browser page cannot enforce network-level IP restriction; this needs a real reverse proxy or firewall.</div></div>
      </div>
      <div class="settings-section">
        <h3 style="font-size:14px;">Container placement</h3>
        <p class="hint">The BILBT yard is open ground — there are no fixed blocks or tiers to configure. Admin can instruct Operations to drop a container on the ground or stack it, and Operations records what actually happened, directly from each container's detail screen.</p>
      </div>
      <div class="settings-section">
        <h3 style="font-size:14px;">Branding & regional</h3>
        <div class="form-grid">
          <div class="field"><label>Organisation name</label><input type="text" id="s-brandname" value="${s.brandName}"></div>
          <div class="field"><label>Primary colour</label><input type="color" id="s-brandcolor" value="${s.brandColor}"></div>
          <div class="field"><label>Vanity URL</label><input type="text" id="s-vanity" value="${s.vanityUrl}" placeholder="tracker.belburge.com"></div>
          <div class="field"><label>Default timezone</label><input type="text" id="s-tz" value="${s.defaultTimezone}"></div>
        </div>
        <div class="disabled-note">Vanity URL requires real DNS/hosting configuration outside this demo. Primary colour is applied live to this session.</div>
      </div>
      <div class="settings-section">
        <h3 style="font-size:14px;">Integrations & developer</h3>
        <div class="toolbar">
          <button class="btn small secondary" disabled>Connect Slack</button>
          <button class="btn small secondary" disabled>Connect Salesforce</button>
          <button class="btn small secondary" disabled>Connect Jira</button>
        </div>
        <div class="disabled-note">Third-party integrations need real backend OAuth connections — not available in this self-contained demo.</div>
        <button class="btn small secondary" style="margin-top:10px;" onclick="generateApiKey()">Generate API key (demo)</button>
        <div class="mono" style="font-size:11.5px;margin-top:6px;">${s.apiKeys.map(k=>k).join('<br>')||'No keys generated yet.'}</div>
        <div class="disabled-note">These are illustrative strings only — no real API is exposed by this demo.</div>
      </div>
      <div class="settings-section">
        <h3 style="font-size:14px;">Compliance & backup</h3>
        <button class="btn small secondary" onclick="downloadFullBackup()">Download full data backup (JSON)</button>
        <button class="btn small secondary" onclick="exportUsersCsv()">Export users report (CSV)</button>
        <button class="btn small secondary" onclick="exportReportsCsv()">Export performance report (CSV)</button>
      </div>
      <div class="settings-section">
        <h3 style="font-size:14px;">High-risk action log</h3>
        ${state.log.filter(l=>l.security).slice(0,25).map(l=>`<div class="history-row"><div class="dot"></div><div><div class="t">${fmtDateTime(l.t)}</div>${l.msg}</div></div>`).join('') || '<div class="tag-line">No security actions recorded yet.</div>'}
      </div>
      <button class="btn" style="margin-top:16px;" onclick="saveGeneralSettings()">Save all settings</button>
    </div></div>`;
}
async function saveGeneralSettings(){
  const s = state.settings;
  s.masterHold = document.getElementById('s-masterhold').checked;
  s.freeDays = Number(document.getElementById('s-freedays').value)||4;
  s.dailyPenaltyRate = Number(document.getElementById('s-rate').value)||0;
  s.minPasswordLength = Number(document.getElementById('s-minpass').value)||6;
  s.passwordExpiryDays = Number(document.getElementById('s-passexp').value)||90;
  s.idleTimeoutMinutes = Number(document.getElementById('s-idle').value)||15;
  s.passwordComplexity = document.getElementById('s-complexity').checked;
  s.mfaRequired = document.getElementById('s-mfa').checked;
  s.ssoRequired = document.getElementById('s-sso').checked;
  s.ipAllowList = document.getElementById('s-ip').value;
  s.brandName = document.getElementById('s-brandname').value.trim() || s.brandName;
  s.brandColor = document.getElementById('s-brandcolor').value;
  s.vanityUrl = document.getElementById('s-vanity').value.trim();
  s.defaultTimezone = document.getElementById('s-tz').value.trim();
  document.documentElement.style.setProperty('--forest', s.brandColor);
  await saveSettings();
  await pushSecurityLog(`${state.person} updated system settings${s.masterHold?' — MASTER HOLD ENABLED':''}`);
  toast('Settings saved.');
  startIdleTimer();
  renderApp();
}
function generateApiKey(){
  const key = 'bilbt_' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  state.settings.apiKeys.push(key);
  saveSettings();
  pushSecurityLog(`${state.person} generated a new API key (demo)`);
  toast('Demo API key generated.');
  renderTab();
}
function downloadFullBackup(){
  const payload = {exportedAt:new Date().toISOString(), users:state.users, containers:state.containers, log:state.log, settings:state.settings, referrals:state.referrals, messages:state.messages};
  downloadBlob(JSON.stringify(payload,null,2), 'belburge-backup-'+Date.now()+'.json', 'application/json');
  pushSecurityLog(`${state.person} downloaded a full data backup for compliance archiving`);
}
function exportReportsCsv(){
  const rows = [['Container','Item','Stage','Owner','Agent','Transire Days','Delivery Days','Duty Status']];
  state.containers.forEach(c=>{
    const transireDays = c.transireSubmittedDate ? daysBetween(c.createdAt) - daysBetween(c.transireSubmittedDate) : '';
    const deliveryDays = c.deliveredDate ? daysBetween(c.createdAt) - daysBetween(c.deliveredDate) : '';
    rows.push([c.containerNumber, c.item, STAGES[c.stageIdx].code, c.owner||'', c.agent||'', transireDays, deliveryDays, c.financial.dutyStatus]);
  });
  const csv = rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(csv, 'belburge-performance-report.csv', 'text/csv');
}

/* ========================= SUPPORT ========================= */
function threadKeyFor(name){ return 'client:'+name; }
function supportHTML(){
  if(state.role!=='admin'){
    const key = threadKeyFor(state.person);
    return renderThread(key, `Support — ${state.person}`, 'Message BILBT staff directly. Attach documents if needed.');
  }
  const clientNames = uniqueNames(state.containers.filter(c=>true),'owner').concat(uniqueNames(state.containers,'agent'));
  const uniqueClients = [...new Set(clientNames)];
  if(!state.supportThreadKey) state.supportThreadKey = 'internal';
  return `
    <div class="topbar"><div><h1>Support</h1><div class="desc">Message importers and agents directly, or coordinate with other BILBT staff internally.</div></div></div>
    <div class="detail-grid">
      <div class="panel"><div class="panel-head"><h3>Conversations</h3></div>
        <div class="panel-body">
          <div class="thread-item" onclick="openThread('internal')"><b>💬 Internal Staff Chat</b><div class="tag-line">All departments</div></div>
          ${uniqueClients.map(n=>`<div class="thread-item" onclick="openThread('${threadKeyFor(n)}')"><b>${n}</b><div class="tag-line">Client support thread</div></div>`).join('')}
        </div></div>
      <div>${renderThread(state.supportThreadKey, state.supportThreadKey==='internal'?'Internal Staff Chat':state.supportThreadKey.replace('client:',''), '')}</div>
    </div>`;
}
function openThread(key){ state.supportThreadKey = key; renderTab(); }
function renderThread(key, title, subtitle){
  const msgs = state.messages.filter(m=>m.channel===key);
  return `
    <div class="panel"><div class="panel-head"><h3>${title}</h3></div>
      <div class="panel-body">
        ${subtitle?`<p class="tag-line" style="margin-bottom:10px;">${subtitle}</p>`:''}
        <div style="max-height:320px;overflow-y:auto;margin-bottom:10px;">
          ${msgs.length===0?'<div class="tag-line">No messages yet — say hello.</div>':
            msgs.map(m=>`<div class="msg-bubble ${m.from===state.person?'mine':''}">
              <div class="msg-meta">${m.from} (${m.fromRole}) · ${fmtDateTime(m.date)}</div>
              ${m.text?`<div>${m.text}</div>`:''}
              ${m.fileName?`<div class="tag-line">📎 ${m.fileName}</div>`:''}
            </div>`).join('')}
        </div>
        <textarea id="msg-text" rows="2" placeholder="Type a message…"></textarea>
        <div class="field" style="margin:8px 0;"><input type="file" id="msg-file"></div>
        <button class="btn small" onclick="sendMessage('${key}')">Send</button>
      </div></div>`;
}
async function sendMessage(key){
  const text = document.getElementById('msg-text').value.trim();
  const fileInput = document.getElementById('msg-file');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if(!text && !file){ toast('Write a message or attach a file.'); return; }
  state.messages.push({id:'m'+Date.now(), channel:key, from:state.person, fromRole:ROLE_META[state.role].name, text, fileName:file?file.name:null, sizeKB:file?Math.round(file.size/1024):null, date:new Date().toISOString()});
  await saveMessages();
  toast('Message sent.');
  renderTab();
}

/* ========================= REFERRALS ========================= */
function referralsHTML(){
  const mine = state.referrals.filter(r=>r.referrerName===state.person);
  const isStaff = state.role==='admin';
  return `
    <div class="topbar"><div><h1>Refer & Earn</h1><div class="desc">Importers referring BILBT earn a discount. Agents referring another agent earn a discount. Staff referrals earn a commission.</div></div></div>
    <div class="panel"><div class="panel-head"><h3>Submit a referral</h3></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field"><label>Referred party name</label><input type="text" id="ref-name"></div>
          <div class="field"><label>Referred party contact</label><input type="text" id="ref-contact" placeholder="Phone or email"></div>
        </div>
        <textarea id="ref-note" rows="2" placeholder="Any context (optional)"></textarea>
        <button class="btn small" style="margin-top:8px;" onclick="submitReferral()">Submit referral</button>
      </div></div>
    <div class="panel"><div class="panel-head"><h3>${isStaff?'All referrals':'My referrals'}</h3></div>
      <div class="panel-body">
        ${(isStaff?state.referrals:mine).length===0?'<div class="tag-line">No referrals yet.</div>':
          (isStaff?state.referrals:mine).map(r=>`
          <div class="action-item"><div class="txt"><b>${r.referredName}</b> <span class="tag-line">(${r.referrerName} · ${r.type.replace('_',' ')})</span>
            <div class="tag-line">${r.referredContact} ${r.note?' · '+r.note:''} · ${fmtDate(r.date)}</div></div>
            <span>${isStaff? `<select id="ref-status-${r.id}"><option ${r.status==='pending'?'selected':''}>pending</option><option ${r.status==='approved'?'selected':''}>approved</option><option ${r.status==='rewarded'?'selected':''}>rewarded</option></select> <button class="btn small secondary" onclick="updateReferralStatus('${r.id}')">Save</button>` : `<span class="pill ${r.status==='rewarded'?'ok':'wait'}">${r.status}</span>`}</span>
          </div>`).join('')}
      </div></div>`;
}
async function submitReferral(){
  const name = document.getElementById('ref-name').value.trim();
  const contact = document.getElementById('ref-contact').value.trim();
  const note = document.getElementById('ref-note').value.trim();
  if(!name || !contact){ toast('Enter the referred party name and contact.'); return; }
  const type = state.role==='importer' ? 'importer_discount' : (state.role==='agent' ? 'agent_discount' : 'staff_commission');
  state.referrals.push({id:'ref'+Date.now(), referrerName:state.person, referrerRole:ROLE_META[state.role].name, referredName:name, referredContact:contact, type, note, status:'pending', date:new Date().toISOString()});
  await saveReferrals();
  toast('Referral submitted.');
  renderTab();
}
async function updateReferralStatus(id){
  const r = state.referrals.find(x=>x.id===id);
  r.status = document.getElementById('ref-status-'+id).value;
  await saveReferrals();
  await pushLog(`Referral for ${r.referredName} marked ${r.status} by ${state.person}`);
  toast('Referral updated.');
  renderTab();
}

/* ========================= ALERTS ========================= */
function adminAlertsHTML(){
  const rows = [];
  state.containers.forEach(c=> c.alerts.forEach(a=> rows.push({c,a})));
  rows.sort((x,y)=> (x.a.status==='active'?0:1) - (y.a.status==='active'?0:1));
  return `
    <div class="topbar"><div><h1>Alerts</h1><div class="desc">Every compliance flag raised across the terminal, active and resolved.</div></div></div>
    <div class="panel"><div class="panel-body">
      ${rows.length===0? `<div class="empty-state"><div class="glyph">✓</div>No alerts have been raised yet.</div>` :
        rows.map(({c,a})=>`
        <div class="action-item">
          <div class="txt"><span class="cn">${c.containerNumber}</span> — <b>${a.type}</b>
            ${a.status==='active'?'<span class="flag" style="margin-left:6px;">Active</span>':'<span class="pill done" style="margin-left:6px;">Resolved</span>'}
            <div class="tag-line">${a.desc}</div></div>
          <button class="btn small secondary" onclick="openContainer('${c.id}')">Open</button>
        </div>`).join('')}
    </div></div>`;
}

/* ========================= PERFORMANCE REPORTS ========================= */
function reportsHTML(){
  const list = state.containers;
  const delivered = list.filter(c=>c.stageIdx>=13 && !c.steppedDown.status);
  const avgTat = delivered.length ? Math.round(delivered.reduce((s,c)=>s+daysBetween(c.createdAt),0)/delivered.length) : 0;

  const transireDone = list.filter(c=>c.transireSubmittedDate);
  const avgTransireDays = transireDone.length ? (transireDone.reduce((s,c)=>s+Math.max(0,daysBetween(c.createdAt)-daysBetween(c.transireSubmittedDate)),0)/transireDone.length).toFixed(1) : '0';
  const deliveredWithDates = list.filter(c=>c.deliveredDate);
  const avgDeliveryDays = deliveredWithDates.length ? (deliveredWithDates.reduce((s,c)=>s+Math.max(0,daysBetween(c.createdAt)-daysBetween(c.deliveredDate)),0)/deliveredWithDates.length).toFixed(1) : '0';

  const alertCounts = {};
  list.forEach(c=>c.alerts.forEach(a=>{ alertCounts[a.type]=(alertCounts[a.type]||0)+1; }));
  const maxAlert = Math.max(1, ...Object.values(alertCounts));

  const stageCounts = {};
  list.forEach(c=>{ if(c.stageIdx<13 && !c.steppedDown.status){ const k=STAGES[c.stageIdx].code; stageCounts[k]=(stageCounts[k]||0)+1; } });
  const maxStage = Math.max(1, ...Object.values(stageCounts), 0);

  const agentCounts = {};
  list.forEach(c=>{ const key = c.agent || 'No agent (direct import)'; agentCounts[key]=(agentCounts[key]||0)+1; });
  const maxAgent = Math.max(1, ...Object.values(agentCounts), 0);

  return `
    <div class="topbar"><div><h1>Performance Reports</h1><div class="desc">Terminal-wide metrics to spot bottlenecks and track turnaround.</div></div>
      ${isSuperAdmin()?`<button class="btn small secondary" onclick="exportReportsCsv()">Export CSV</button>`:''}</div>
    <div class="metric-row">
      <div class="metric"><div class="num">${avgTat}d</div><div class="lbl">Avg. total turnaround</div></div>
      <div class="metric"><div class="num">${avgTransireDays}d</div><div class="lbl">Avg. days to submit transire</div></div>
      <div class="metric"><div class="num">${avgDeliveryDays}d</div><div class="lbl">Avg. days to delivery</div></div>
      <div class="metric"><div class="num">${list.filter(c=>c.steppedDown.status).length}</div><div class="lbl">Stepped down</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Bottleneck — jobs currently sitting per stage</h3></div>
      <div class="panel-body">
        ${Object.keys(stageCounts).length===0 ? '<div class="tag-line">No jobs in progress.</div>' :
          Object.entries(stageCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div>
            <div class="bar-track"><div class="bar-fill amber" style="width:${(v/maxStage*100).toFixed(0)}%"></div></div></div>`).join('')}
      </div></div>
    <div class="panel"><div class="panel-head"><h3>Alerts by type</h3></div>
      <div class="panel-body">
        ${Object.keys(alertCounts).length===0 ? '<div class="tag-line">No alerts raised yet.</div>' :
          Object.entries(alertCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div>
            <div class="bar-track"><div class="bar-fill rust" style="width:${(v/maxAlert*100).toFixed(0)}%"></div></div></div>`).join('')}
      </div></div>
    <div class="panel"><div class="panel-head"><h3>Jobs handled per agent</h3></div>
      <div class="panel-body">
        ${Object.keys(agentCounts).length===0 ? '<div class="tag-line">No jobs yet.</div>' :
          Object.entries(agentCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(v/maxAgent*100).toFixed(0)}%"></div></div></div>`).join('')}
      </div></div>`;
}

/* ========================= ACTIVITY LOG ========================= */
function activityLogHTML(){
  return `
    <div class="topbar"><div><h1>Activity Log</h1><div class="desc">Every status change, alert, and handover notification across the terminal.</div></div></div>
    <div class="panel"><div class="panel-body">
      ${state.log.length===0 ? `<div class="empty-state"><div class="glyph">—</div>No activity yet.</div>` :
        state.log.map(l=>`<div class="history-row"><div class="dot"></div><div><div class="t">${fmtDateTime(l.t)}</div>${l.dept?`<span class="dept-chip">${l.dept}</span>`:''}${l.msg}</div></div>`).join('')}
    </div></div>`;
}

/* ========================= INIT ========================= */
(async function init(){
  if(getApiBase()){
    await tryBootstrapServer();
    try{ state.settings = await loadSettings(); }catch(e){ state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); }
    document.documentElement.style.setProperty('--forest', state.settings.brandColor);
  }
  renderLogin();
})();
</script>
</body>
</html>
