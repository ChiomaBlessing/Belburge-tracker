name: Build APK / IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
        working-directory: belburge-mobile
      - run: npx cap sync android
        working-directory: belburge-mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: belburge-mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: belburge-mobile/android/app/build/outputs/apk/debug/app-debug.apk

  android-release:
    runs-on: ubuntu-latest
    # Build signed AAB/APK only when signing secrets are configured (Google Play App Signing)
    if: secrets.ANDROID_KEYSTORE_BASE64 != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
        working-directory: belburge-mobile
      - run: npx cap sync android
        working-directory: belburge-mobile
      # Keystore is fed via env vars at build time — no file committed (see PLAY_STORE_GUIDE.md)
      - run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease
        working-directory: belburge-mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: belburge-mobile/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: belburge-mobile/android/app/build/outputs/apk/release/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: belburge-mobile
      - run: npx cap sync ios
        working-directory: belburge-mobile
      - run: cd ios/App && pod install
        working-directory: belburge-mobile
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build
        working-directory: belburge-mobile
        # For real IPA distribution, set up Apple signing in Xcode and use `archive` + `exportArchive`
